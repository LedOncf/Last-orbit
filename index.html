<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Orbit</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/cards.css">
</head>
<body>
    <div id="screen-intro" class="screen active">
        <div class="animation-bg" id="animation-bg">
            <img src="assets/img/telefonoApagado.png" alt="" class="bg-off">
            <img src="assets/img/TelefonoPrendido.png" alt="" class="bg-on">
        </div>
        <div class="intro-content"><button id="btn-start" class="btn-start">Answer</button></div>
    </div>

    <div id="modal-intro" class="modal-overlay hidden">
        <div class="modal-box">
            <p class="modal-text">"Hello!! Luke, congratulations on your promotion to Commander. I know howhard you worked to get here, and it is urgent that you see this. During a routine sweep by the Vera C. Rubin Observatory in the Chilean Andes, an uncataloged object was suddenlydetected moving at hyperbolic speed." .</p>
            <button id="btn-next" class="btn-next">Next</button>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <header class="hud">
            <div class="hud-stats" id="hud-stats"></div>
            <div class="hud-crew" id="hud-crew"></div>
            <div class="hud-meta" id="hud-meta"></div>
        </header>
        <div id="event-banner" class="event-banner" hidden></div>

        <div class="comic-pages">
            <div class="comic-layout comic-page active" data-page="1">
                <div class="comic-panel panel--1">
                    <canvas class="minigame-canvas" data-minigame="1"></canvas>
                </div>
                <div src="assets/img/img1.png" alt="launch" class="comic-panel-img"></div>
                <div class="comic-panel panel--3"></div>
            </div>
            <div class="comic-layout comic-page layout--b" data-page="2">
                <div class="comic-panel panel--wide panel--4">
                    <canvas class="minigame-canvas" data-minigame="2"></canvas></div>
                <div class="comic-panel panel--5"></div>
                <div class="comic-panel panel--6"></div>
                <div class="comic-panel panel--7"></div>
            </div>
            <div class="comic-layout comic-page layout--c" data-page="3">
                <div class="comic-panel panel--5"></div>
                <div class="comic-panel panel--4"></div>
                <div class="comic-panel panel--wide panel--6">
                    <canvas class="minigame-canvas" data-minigame="3"></canvas>
                </div>
            </div>
        <div class="comic-layout comic-page layout--d" data-page="4">
                <div class="comic-panel panel--8">
                    <canvas class="minigame-canvas" data-minigame="4"></canvas></div>
                <div class="comic-panel panel--9"></div>
                <div class="comic-panel panel--10"></div>
                <div class="comic-panel panel--7"></div>
            </div>
            <div class="comic-layout comic-page layout--e" data-page="5">
                <div class="comic-panel panel--9"></div>
                <div class="comic-panel panel--tall panel--5">
                    <canvas class="minigame-canvas" data-minigame="5"></canvas></div>
                <div class="comic-panel panel--8"></div>
            </div>
        </div>

        <div class="card-tray">
            <span id="plays-left"></span>
            <div class="card-hand" id="card-hand"></div>
        </div>
        <div class="game-footer">
            <span id="minigame-hint" class="hint"></span>
            <span id="page-indicator" class="page-indicator">1 / 5</span>
            <button id="btn-next-page" class="btn-nav" disabled>Next page →</button>
        </div>
    </div>

    <div id="screen-ending" class="screen">
        <div class="ending-content">
            <h2 id="ending-title"></h2>
            <p id="ending-text"></p>
            <ul id="ending-stats"></ul>
            <button id="btn-restart" class="btn-nav btn-nav--highlight">Play Again</button>
        </div>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
