<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Orbit</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- adding comment just to save the button functionality -->
    <!-- SCREEN 1: Intro -->
    <div id="screen-intro" class="screen active">
        <div class="animation-bg" id="animation-bg">
            <!-- Background animation goes here -->
        </div>
        <div class="intro-content">
            <button id="btn-start" class="btn-start">Answer</button>
        </div>
    </div>

    <!-- SCREEN 2: Game -->
    <div id="screen-game" class="screen">
        <button class="btn-pause" id="btn-pause-game">
            <img src="assets/img/hamburguerMenu.svg" alt="Menu" class="btn-icon">
        </button>
        <div class="game-content">
            <!-- Game UI goes here -->
            <button id="btn-go-ending" class="btn-nav">Go to Ending →</button>
        </div>
    </div>

    <!-- SCREEN 3: Ending -->
    <div id="screen-ending" class="screen">
        <button class="btn-pause" id="btn-pause-ending">
            <img src="assets/img/hamburguerMenu.svg" alt="Menu" class="btn-icon">
        </button>
        <div class="ending-content">
            <!-- Ending UI goes here -->
            <button id="btn-restart" class="btn-nav btn-nav--highlight">Play Again</button>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
